<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Delete Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center p-6">

<div class="bg-white rounded-2xl shadow-lg max-w-md w-full p-8 animate-fadeIn text-center">
    <h1 class="text-3xl font-extrabold text-teal-700 mb-6">Feedback Deleted</h1>
    <p class="text-red-600 font-semibold mb-8">The feedback has been deleted successfully.</p>
    <a th:href="@{/feedbacks}"
       class="inline-block bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl hover:bg-blue-600 transition shadow-md">
        ← Back to Feedback List
    </a>
</div>

<style>
    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(10px);}
        to {opacity: 1; transform: translateY(0);}
    }
    .animate-fadeIn {
        animation: fadeIn 0.4s ease forwards;
    }
</style>

</body>
</html>
