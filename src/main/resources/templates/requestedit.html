<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Rental Request</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-teal-100 min-h-screen flex items-center justify-center">

<div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 border border-teal-100">
    <h1 class="text-3xl font-bold text-teal-700 text-center mb-6">Edit Rental Request</h1>

    <form th:action="@{/requests/edit}" method="post" class="space-y-5">
        <input type="hidden" name="id" th:value="${request.id}">

        <div>
            <label for="userName" class="block text-gray-700 font-semibold mb-1">User Name</label>
            <input type="text" id="userName" name="userName" th:value="${request.userName}" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-teal-500 transition">
        </div>

        <div>
            <label for="bikeType" class="block text-gray-700 font-semibold mb-1">Bike Type</label>
            <select id="bikeType" name="bikeType" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-teal-500 transition">
                <option value="Electric" th:selected="${request.bikeType == 'Electric'}">Electric Bike</option>
                <option value="Manual" th:selected="${request.bikeType == 'Manual'}">Manual Bike</option>
            </select>
        </div>

        <div>
            <label for="status" class="block text-gray-700 font-semibold mb-1">Status</label>
            <select id="status" name="status" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-teal-500 transition">
                <option value="Pending" th:selected="${request.status == 'Pending'}">Pending</option>
                <option value="Assigned" th:selected="${request.status == 'Assigned'}">Assigned</option>
                <option value="Cancelled" th:selected="${request.status == 'Cancelled'}">Cancelled</option>
            </select>
        </div>

        <div class="flex justify-end space-x-4 pt-2">
            <a href="/requests"
               class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded-lg font-semibold transition">
                Cancel
            </a>
            <button type="submit"
                    class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg font-semibold transition">
                Update
            </button>
        </div>
    </form>
</div>

</body>
</html>
