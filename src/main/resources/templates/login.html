<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-teal-100 min-h-screen flex items-center justify-center p-6">

<div class="w-full max-w-sm bg-white rounded-3xl shadow-2xl p-10 border border-gray-100">
  <h2 class="text-4xl font-extrabold text-center text-teal-700 mb-8 tracking-wide">Login</h2>

  <div th:if="${error}" class="text-red-600 text-center font-semibold mb-6" th:text="${error}"></div>

  <form th:action="@{/user/login}" method="post" class="space-y-6">
    <div>
      <label for="email" class="block text-gray-700 font-semibold mb-2">Email</label>
      <input
              type="email"
              name="email"
              id="email"
              required
              placeholder="you@example.com"
              class="w-full px-5 py-3 border border-gray-300 rounded-xl shadow-sm
                 placeholder-gray-400 focus:outline-none focus:ring-3 focus:ring-teal-400
                 transition duration-200"
      />
    </div>

    <div>
      <label for="password" class="block text-gray-700 font-semibold mb-2">Password</label>
      <input
              type="password"
              name="password"
              id="password"
              required
              placeholder="••••••••"
              class="w-full px-5 py-3 border border-gray-300 rounded-xl shadow-sm
                 placeholder-gray-400 focus:outline-none focus:ring-3 focus:ring-teal-400
                 transition duration-200"
      />
    </div>

    <button
            type="submit"
            class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-xl
               shadow-lg hover:shadow-xl transition duration-300"
    >
      Login
    </button>
  </form>

  <p class="mt-8 text-center text-gray-600 text-sm">
    Don't have an account?
    <a th:href="@{/user/signup}" class="text-teal-600 font-semibold hover:underline transition">
      Sign Up
    </a>
  </p>
</div>

</body>
</html>
