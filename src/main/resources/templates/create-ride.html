<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Create Ride</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f2f4f8;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 100%;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 24px;
        }

        form label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            margin-top: 14px;
        }

        form input[type="text"],
        form input[type="date"] {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        form button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        form button:hover {
            background-color: #0056b3;
        }

        .message {
            margin-top: 20px;
            color: green;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Create a Ride Share</h2>

    <form th:action="@{/create-ride}" th:object="${ride}" method="post">
        <label>Name:</label>
        <input type="text" th:field="*{name}" required>

        <label>Contact:</label>
        <input type="text" th:field="*{contact}" pattern="[0-9]{10}" required>

        <label>Origin:</label>
        <input type="text" th:field="*{origin}" required>

        <label>Destination:</label>
        <input type="text" th:field="*{destination}" required>

        <label>Travel Date:</label>
        <input type="date" th:field="*{travelDate}" required>

        <button type="submit">Share Ride</button>
    </form>

    <p th:if="${message}" th:text="${message}" class="message"></p>
</div>
</body>
</html>
