<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <title>All Users</title>
  <style>
    /* Base styles */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
      padding: 30px 15px;
      color: #333;
      margin: 0;
    }

    /* Container for centering content */
    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h2 {
      color: #2c3e50;
      margin-bottom: 24px;
      font-weight: 700;
      text-align: center;
    }

    /* Button styles */
    a.button {
      display: inline-block;
      padding: 10px 18px;
      margin-bottom: 20px;
      background-color: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      box-shadow: 0 3px 7px rgba(52, 152, 219, 0.4);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      user-select: none;
    }
    a.button:hover,
    a.button:focus {
      background-color: #2980b9;
      box-shadow: 0 4px 10px rgba(41, 128, 185, 0.6);
      outline: none;
    }

    /* Table container for shadow and rounding */
    .table-wrapper {
      overflow-x: auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border-radius: 10px;
      background-color: #fff;
      padding: 10px;
    }

    /* Table styling */
    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 10px;
      min-width: 600px; /* For horizontal scroll on small screens */
    }

    th, td {
      padding: 14px 18px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background-color: #2c3e50;
      color: #fff;
      font-weight: 600;
      user-select: none;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    tbody tr {
      border-bottom: 1px solid #e0e0e0;
      transition: background-color 0.2s ease;
      cursor: default;
    }
    tbody tr:hover {
      background-color: #f1f8ff;
    }

    /* Zebra striping */
    tbody tr:nth-child(even) {
      background-color: #fafafa;
    }

    /* Action links styled as buttons */
    td a {
      display: inline-block;
      padding: 6px 12px;
      margin-right: 8px;
      color: white;
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
      user-select: none;
      transition: background-color 0.3s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    td a.edit {
      background-color: #3498db;
    }
    td a.edit:hover,
    td a.edit:focus {
      background-color: #2980b9;
      outline: none;
    }

    td a.delete {
      background-color: #e74c3c;
    }
    td a.delete:hover,
    td a.delete:focus {
      background-color: #c0392b;
      outline: none;
    }

    /* Responsive text wrapping */
    @media (max-width: 640px) {
      th, td {
        padding: 10px 8px;
        font-size: 14px;
      }
      a.button {
        width: 100%;
        box-sizing: border-box;
        text-align: center;
      }
    }

    /* No users message */
    .no-users {
      text-align: center;
      padding: 40px 0;
      color: #888;
      font-style: italic;
      font-weight: 600;
      user-select: none;
    }
  </style>

  <script>
    // Optional: confirm deletion handler (can be replaced with inline onclick if preferred)
    function confirmDelete(event) {
      if (!confirm('Are you sure you want to delete this user?')) {
        event.preventDefault();
      }
    }
  </script>
</head>
<body>

<div class="container">
  <h2>All Users</h2>

  <a class="button" th:href="@{/users/create}">Create New User</a>

  <div class="table-wrapper">
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Town</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.firstName}"></td>
        <td th:text="${user.lastName}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.town}"></td>
        <td>
          <a class="edit" th:href="@{/users/edit/{id}(id=${user.id})}">Edit</a>
          <a class="delete" href="#" th:href="@{/users/delete/{id}(id=${user.id})}" onclick="confirmDelete(event)">Delete</a>
        </td>
      </tr>

      <tr th:if="${#lists.isEmpty(users)}">
        <td class="no-users" colspan="6">No users found.</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

</body>
</html>
