<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Add Bike</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-100 to-indigo-200 flex items-center justify-center p-6">
<div class="max-w-md w-full bg-white rounded-xl shadow-xl p-10">

    <!-- Form -->
    <h1 class="text-3xl font-extrabold text-indigo-700 mb-8 text-center">Add Bike</h1>
    <form th:action="@{/bikes/add}" method="post" class="space-y-6">
        <div>
            <label class="block text-gray-700 font-semibold mb-2" for="type">Bike Type</label>
            <select id="type" name="type" required
                    class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-4 focus:ring-indigo-400 transition">
                <option value="" disabled selected>Select bike type</option>
                <option value="Electric">Electric Bike</option>
                <option value="Manual">Manual Bike</option>
            </select>
        </div>
        <div>
            <label class="block text-gray-700 font-semibold mb-2" for="model">Model</label>
            <input id="model" type="text" name="model" required
                   class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-4 focus:ring-indigo-400 transition" />
        </div>
        <div>
            <label class="block text-gray-700 font-semibold mb-2" for="availabilityCount">Availability Count</label>
            <input id="availabilityCount" type="number" name="availabilityCount" min="0" required
                   class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-4 focus:ring-indigo-400 transition" />
        </div>
        <div>
            <label class="block text-gray-700 font-semibold mb-2" for="rating">Rating (0-5)</label>
            <input id="rating" type="number" step="0.1" min="0" max="5" name="rating" required
                   class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-4 focus:ring-indigo-400 transition" />
        </div>
        <div class="flex justify-end gap-4 mt-6">
            <a href="/bikes" class="px-6 py-3 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition font-semibold">Cancel</a>
            <button type="submit" class="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-semibold">Submit</button>
        </div>
    </form>
</div>
</body>
</html>
