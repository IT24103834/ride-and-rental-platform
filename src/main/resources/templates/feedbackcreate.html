<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Submit Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center p-6">

<div class="bg-white rounded-2xl shadow-lg max-w-md w-full p-8 animate-fadeIn">
    <h1 class="text-2xl font-extrabold text-teal-700 mb-8 text-center">Submit Feedback</h1>

    <form th:action="@{/feedbacks/create}" th:object="${feedback}" method="post" class="space-y-6">
        <!-- Comment -->
        <div>
            <label for="comment" class="block mb-2 font-semibold text-blue-800 text-sm">Your Comment</label>
            <textarea id="comment" th:field="*{comment}" rows="5"
                      placeholder="Let us know your experience..."
                      required
                      class="w-full rounded-xl border-2 border-blue-200 bg-blue-100 text-blue-900 px-4 py-3
                       focus:outline-none focus:ring-4 focus:ring-blue-400 focus:border-blue-500
                       transition-colors resize-none
                "></textarea>
        </div>

        <!-- Rating -->
        <div>
            <label class="block mb-2 font-semibold text-blue-800 text-sm">Rate your experience (1-5)</label>
            <input type="hidden" th:field="*{rating}" id="ratingInput" />

            <div class="flex justify-between space-x-3">
                <button type="button" data-value="1"
                        class="rating-btn flex-1 rounded-xl px-4 py-3 bg-blue-100 text-blue-900
                           shadow-sm hover:bg-blue-200 transition-colors font-semibold
                    ">1</button>
                <button type="button" data-value="2"
                        class="rating-btn flex-1 rounded-xl px-4 py-3 bg-blue-100 text-blue-900
                           shadow-sm hover:bg-blue-200 transition-colors font-semibold
                    ">2</button>
                <button type="button" data-value="3"
                        class="rating-btn flex-1 rounded-xl px-4 py-3 bg-blue-100 text-blue-900
                           shadow-sm hover:bg-blue-200 transition-colors font-semibold
                    ">3</button>
                <button type="button" data-value="4"
                        class="rating-btn flex-1 rounded-xl px-4 py-3 bg-blue-100 text-blue-900
                           shadow-sm hover:bg-blue-200 transition-colors font-semibold
                    ">4</button>
                <button type="button" data-value="5"
                        class="rating-btn flex-1 rounded-xl px-4 py-3 bg-blue-100 text-blue-900
                           shadow-sm hover:bg-blue-200 transition-colors font-semibold
                    ">5</button>
            </div>
        </div>

        <!-- Buttons -->
        <div class="flex justify-end space-x-4 pt-6">
            <a th:href="@{/feedbacks}"
               class="bg-gray-400 text-white px-5 py-3 rounded-xl hover:bg-gray-500 transition font-semibold shadow-md">
                Cancel
            </a>
            <button type="submit"
                    class="bg-teal-500 text-white px-5 py-3 rounded-xl hover:bg-teal-600 transition font-semibold shadow-md">
                Submit
            </button>
        </div>

        <!-- Error Message -->
        <p th:if="${param.error}" class="text-red-500 text-center mt-4 font-semibold" th:text="${param.error}"></p>
    </form>
</div>

<!-- Rating Selection Script -->
<script>
    const ratingButtons = document.querySelectorAll('.rating-btn');
    const ratingInput = document.getElementById('ratingInput');

    ratingButtons.forEach(button => {
        button.addEventListener('click', () => {
            ratingButtons.forEach(btn => {
                btn.classList.remove('bg-blue-500', 'text-white', 'shadow-lg');
                btn.classList.add('bg-blue-100', 'text-blue-900', 'shadow-sm');
            });
            button.classList.remove('bg-blue-100', 'text-blue-900', 'shadow-sm');
            button.classList.add('bg-blue-500', 'text-white', 'shadow-lg');
            ratingInput.value = button.getAttribute('data-value');
        });
    });
</script>

<style>
    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(10px);}
        to {opacity: 1; transform: translateY(0);}
    }
    .animate-fadeIn {
        animation: fadeIn 0.4s ease forwards;
    }
</style>

</body>
</html>
