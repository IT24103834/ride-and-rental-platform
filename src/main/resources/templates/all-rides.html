<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <title>All Shared Rides</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f6f8fa;
      padding: 40px;
      color: #333;
    }
    h2 {
      color: #2c3e50;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    tr:hover {
      background-color: #f1f1f1;
    }
    a {
      color: #007bff;
      text-decoration: none;
      margin: 0 5px;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
<h2>All Shared Rides</h2>

<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
  <!-- Search Form -->
  <form th:action="@{/search-rides}" method="get" style="display: flex; gap: 8px;">
    <input type="text" name="location" placeholder="Search by location" required
           style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
    <button type="submit"
            style="padding: 8px 14px; border: none; background-color: #007bff; color: white; border-radius: 6px;">
      Search
    </button>
  </form>

  <!-- Create Ride Button -->
  <a th:href="@{/create-ride}"
     style="padding: 8px 14px; background-color: #28a745; color: white; border-radius: 6px;
            text-decoration: none; font-weight: bold;">
    + Create Ride
  </a>
</div>

<table>
  <thead>
  <tr>
    <th>Name</th>
    <th>Contact</th>
    <th>Origin</th>
    <th>Destination</th>
    <th>Travel Date</th>
    <th>Actions</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="ride : ${rides}">
    <td th:text="${ride.name}">Name</td>
    <td th:text="${ride.contact}">Contact</td>
    <td th:text="${ride.origin}">Origin</td>
    <td th:text="${ride.destination}">Destination</td>
    <td th:text="${ride.travelDate}">Date</td>
    <td>
      <a th:href="@{'/edit-ride/' + ${ride.id}}">Edit</a> |
      <a th:href="@{'/delete-ride/' + ${ride.id}}" onclick="return confirm('Are you sure you want to delete this ride?')">Delete</a>
    </td>
  </tr>
  </tbody>
</table>
</body>
</html>
