<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>My Profile</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Segoe+UI&display=swap');

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f8fafc, #e0f2f1); /* soft dashboard gradient */
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 500px;
      width: 100%;
      background-color: #ffffff;
      padding: 36px 42px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      border: 1px solid #e0f2f1;
      transition: all 0.3s ease;
    }

    .container:hover {
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 700;
      font-size: 2rem;
      color: #00695c; /* teal-dark */
    }

    .info {
      margin-bottom: 18px;
      font-size: 1.05rem;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
      color: #374151; /* slate-700 */
    }

    .info label {
      font-weight: 600;
      color: #0f172a; /* slate-900 */
      flex-shrink: 0;
    }

    .info span {
      color: #475569; /* slate-600 */
      font-weight: 500;
      max-width: 60%;
      word-wrap: break-word;
      text-align: right;
    }

    .actions {
      text-align: center;
      margin-top: 35px;
    }

    .button {
      display: inline-block;
      padding: 12px 22px;
      background-color: #0d9488; /* teal-600 */
      color: white;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      margin: 10px 8px;
      box-shadow: 0 4px 10px rgba(13, 148, 136, 0.3);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      user-select: none;
    }

    .button:hover {
      background-color: #0f766e; /* teal-700 */
      box-shadow: 0 6px 14px rgba(13, 148, 136, 0.45);
    }

    .button.logout {
      background-color: #ef4444; /* red-500 */
      box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
    }

    .button.logout:hover {
      background-color: #dc2626; /* red-600 */
      box-shadow: 0 6px 14px rgba(220, 38, 38, 0.45);
    }

    .button.delete {
      background-color: #b91c1c; /* red-700 */
      box-shadow: 0 4px 10px rgba(185, 28, 28, 0.3);
    }

    .button.delete:hover {
      background-color: #991b1b; /* red-800 */
      box-shadow: 0 6px 14px rgba(153, 27, 27, 0.5);
    }
  </style>
</head>
<body>

<div class="container">
  <h2>My Profile</h2>

  <div class="info"><label>First Name:</label> <span th:text="${user.firstName}">John</span></div>
  <div class="info"><label>Last Name:</label> <span th:text="${user.lastName}">Doe</span></div>
  <div class="info"><label>Email:</label> <span th:text="${user.email}">john.doe@example.com</span></div>
  <div class="info"><label>Town:</label> <span th:text="${user.town}">New York</span></div>

  <div class="actions">
    <a class="button" th:href="@{/user/profile/edit}">Edit Profile</a>
    <a class="button logout" th:href="@{/user/logout}">Logout</a>
    <a class="button delete" th:href="@{/user/profile/delete}"
       onclick="return confirm('Are you sure you want to delete your profile? This action cannot be undone.');">
      Delete Profile
    </a>
  </div>
</div>

</body>
</html>
