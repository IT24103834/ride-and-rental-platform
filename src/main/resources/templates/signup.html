<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Sign Up</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #bfdbfe, #2dd4bf);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 450px;
      width: 100%;
      background: white;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(45, 212, 191, 0.3);
      padding: 2.5rem 2rem 3rem;
    }

    h2 {
      text-align: center;
      color: #0f766e; /* teal-700 */
      margin-bottom: 2rem;
      font-weight: 800;
      font-size: 2.25rem;
      border-bottom: none;
      user-select: none;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #134e4a; /* teal-900 */
      font-weight: 600;
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 0.4rem 0.5rem; /* smaller padding */
      border: 1.5px solid #81e6d9; /* teal-300 */
      border-radius: 0.5rem;
      font-size: 0.9rem; /* smaller font */
      transition: border-color 0.3s ease;
    }
    input:focus {
      outline: none;
      border-color: #0f766e; /* teal-700 */
      box-shadow: 0 0 6px rgba(15, 118, 110, 0.5);
    }

    .error {
      color: #dc2626; /* red-600 */
      text-align: center;
      margin-bottom: 1rem;
      font-weight: 600;
      font-size: 0.9rem;
    }

    button {
      width: 100%;
      padding: 0.5rem; /* smaller padding */
      background-color: #0f766e; /* teal-700 */
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-weight: 700;
      font-size: 1rem; /* slightly smaller */
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(15, 118, 110, 0.5);
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #134e4a;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: #0f766e;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: text-decoration 0.3s ease;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Create Account</h2>

  <div class="error" th:if="${error}" th:text="${error}"></div>

  <form th:action="@{/user/signup}" method="post" th:object="${user}">
    <div class="form-group">
      <label>First Name</label>
      <input type="text" th:field="*{firstName}" required />
    </div>

    <div class="form-group">
      <label>Last Name</label>
      <input type="text" th:field="*{lastName}" required />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" th:field="*{email}" required />
    </div>

    <div class="form-group">
      <label>Town</label>
      <input type="text" th:field="*{town}" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" th:field="*{password}" required />
    </div>

    <button type="submit">Sign Up</button>
  </form>

  <a th:href="@{/user/login}">Already have an account? Login</a>
</div>

</body>
</html>
