<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Update Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-blue-50 via-teal-50 to-green-50 min-h-screen flex items-center justify-center p-6">

<div class="max-w-md w-full bg-white rounded-2xl shadow-2xl border border-teal-100 p-8">
    <h1 class="text-3xl font-extrabold text-teal-700 mb-8 text-center">Update Feedback</h1>

    <form th:action="@{/feedbacks/update}" th:object="${feedback}" method="post" class="space-y-6">
        <input type="hidden" th:field="*{id}">

        <div>
            <label for="comment" class="block text-gray-700 font-semibold mb-2">Comment</label>
            <textarea id="comment" th:field="*{comment}" rows="4" required
                      class="w-full p-4 border border-gray-300 rounded-xl bg-blue-50 text-gray-900
                             focus:outline-none focus:ring-2 focus:ring-teal-500 shadow-sm resize-none"></textarea>
        </div>

        <div>
            <label class="block text-gray-700 font-semibold mb-2">Rating (1–5)</label>
            <input type="hidden" th:field="*{rating}" id="ratingInput" />

            <div class="flex justify-between space-x-3">
                <button type="button"
                        class="rating-btn flex-1 px-4 py-3 rounded-xl font-semibold transition
                               hover:bg-teal-300 focus:outline-none focus:ring-2 focus:ring-teal-400"
                        th:classappend="${feedback.rating} == 1 ? 'bg-teal-600 text-white' : 'bg-gray-200 text-gray-700'"
                        data-value="1">1</button>
                <button type="button"
                        class="rating-btn flex-1 px-4 py-3 rounded-xl font-semibold transition
                               hover:bg-teal-300 focus:outline-none focus:ring-2 focus:ring-teal-400"
                        th:classappend="${feedback.rating} == 2 ? 'bg-teal-600 text-white' : 'bg-gray-200 text-gray-700'"
                        data-value="2">2</button>
                <button type="button"
                        class="rating-btn flex-1 px-4 py-3 rounded-xl font-semibold transition
                               hover:bg-teal-300 focus:outline-none focus:ring-2 focus:ring-teal-400"
                        th:classappend="${feedback.rating} == 3 ? 'bg-teal-600 text-white' : 'bg-gray-200 text-gray-700'"
                        data-value="3">3</button>
                <button type="button"
                        class="rating-btn flex-1 px-4 py-3 rounded-xl font-semibold transition
                               hover:bg-teal-300 focus:outline-none focus:ring-2 focus:ring-teal-400"
                        th:classappend="${feedback.rating} == 4 ? 'bg-teal-600 text-white' : 'bg-gray-200 text-gray-700'"
                        data-value="4">4</button>
                <button type="button"
                        class="rating-btn flex-1 px-4 py-3 rounded-xl font-semibold transition
                               hover:bg-teal-300 focus:outline-none focus:ring-2 focus:ring-teal-400"
                        th:classappend="${feedback.rating} == 5 ? 'bg-teal-600 text-white' : 'bg-gray-200 text-gray-700'"
                        data-value="5">5</button>
            </div>
        </div>

        <div class="flex justify-end space-x-4 pt-4">
            <a th:href="@{/feedbacks}"
               class="bg-gray-400 hover:bg-gray-500 text-white px-6 py-3 rounded-xl font-semibold shadow transition">
                Cancel
            </a>
            <button type="submit"
                    class="bg-teal-600 hover:bg-teal-700 text-white px-6 py-3 rounded-xl font-semibold shadow transition">
                Update
            </button>
        </div>

        <p th:if="${param.error}"
           class="text-red-600 mt-4 text-center font-semibold"
           th:text="${param.error}"></p>
    </form>
</div>

<script>
    const ratingButtons = document.querySelectorAll('.rating-btn');
    const ratingInput = document.getElementById('ratingInput');

    ratingButtons.forEach(button => {
        button.addEventListener('click', () => {
            ratingButtons.forEach(btn => {
                btn.classList.remove('bg-teal-600', 'text-white');
                btn.classList.add('bg-gray-200', 'text-gray-700');
            });
            button.classList.remove('bg-gray-200', 'text-gray-700');
            button.classList.add('bg-teal-600', 'text-white');
            ratingInput.value = button.getAttribute('data-value');
        });
    });
</script>

</body>
</html>
