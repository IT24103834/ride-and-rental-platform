<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Edit Bike</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-100 to-indigo-200 flex items-center justify-center p-6">
<div class="max-w-md w-full bg-white rounded-xl shadow-xl p-10 animate-fadeIn">

    <h1 class="text-3xl font-extrabold text-indigo-700 mb-8 text-center">Edit Bike</h1>

    <form th:action="@{/bikes/edit}" method="post" class="space-y-6">
        <input type="hidden" name="id" th:value="${bike.id}" />

        <div>
            <label for="type" class="block text-indigo-700 font-semibold mb-2">Bike Type</label>
            <select id="type" name="type" required
                    class="w-full p-3 border border-indigo-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-indigo-50 text-indigo-900">
                <option value="Electric" th:selected="${bike.type == 'Electric'}">Electric Bike</option>
                <option value="Manual" th:selected="${bike.type == 'Manual'}">Manual Bike</option>
            </select>
        </div>

        <div>
            <label for="model" class="block text-indigo-700 font-semibold mb-2">Model</label>
            <input id="model" type="text" name="model" th:value="${bike.model}" required
                   class="w-full p-3 border border-indigo-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-indigo-50 text-indigo-900" />
        </div>

        <div>
            <label for="availabilityCount" class="block text-indigo-700 font-semibold mb-2">Availability Count</label>
            <input id="availabilityCount" type="number" name="availabilityCount" th:value="${bike.availabilityCount}" min="0" required
                   class="w-full p-3 border border-indigo-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-indigo-50 text-indigo-900" />
        </div>

        <div>
            <label for="rating" class="block text-indigo-700 font-semibold mb-2">Rating (0-5)</label>
            <input id="rating" type="number" name="rating" th:value="${bike.rating}" step="0.1" min="0" max="5" required
                   class="w-full p-3 border border-indigo-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-indigo-50 text-indigo-900" />
        </div>

        <div class="flex justify-end gap-4">
            <a href="/bikes"
               class="px-6 py-3 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition font-semibold shadow-md hover:shadow-lg text-center">
                Cancel
            </a>
            <button type="submit"
                    class="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-semibold shadow-md hover:shadow-lg">
                Update
            </button>
        </div>
    </form>

</div>

<style>
    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }
    .animate-fadeIn {
        animation: fadeIn 0.6s ease forwards;
    }
</style>
</body>
</html>
