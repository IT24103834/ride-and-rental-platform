<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Delete Bike</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-100 to-indigo-200 flex items-center justify-center p-6">
<div class="max-w-md w-full bg-white rounded-xl shadow-xl p-10 animate-fadeIn">

    <h1 class="text-3xl font-extrabold text-indigo-700 mb-8 text-center">Delete Bike</h1>

    <p class="text-lg text-indigo-800 mb-6 text-center">Are you sure you want to delete this bike?</p>

    <p class="text-md font-semibold text-indigo-900 mb-10 italic text-center" th:text="${bike.displayInfo()}"></p>

    <form th:action="@{/bikes/delete/}+${bike.id}" method="post" class="flex justify-center gap-6">
        <input type="hidden" name="id" th:value="${bike.id}" />

        <a href="/bikes"
           class="px-6 py-3 bg-gray-300 text-gray-700 rounded-lg font-semibold hover:bg-gray-400 transition duration-300 shadow-md hover:shadow-lg text-center">
            Cancel
        </a>

        <button type="submit"
                class="px-6 py-3 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition duration-300 shadow-md hover:shadow-lg">
            Delete
        </button>
    </form>
</div>

<style>
    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }
    .animate-fadeIn {
        animation: fadeIn 0.6s ease forwards;
    }
</style>
</body>
</html>
